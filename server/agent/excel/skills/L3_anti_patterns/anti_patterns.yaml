  last_seen: '2026-08-11T14:12:18+08:00'
  action: force_exact
  status: active
  source: ai_induction
  trigger_pattern: 新增,NPC,编号
  rationale: 新增NPC等新行时使用递增编号，新值必然高于列历史分布（median/MAD检测）而误报语义离群，且系统把值修正为历史中位数会导致重复ID。触发特征是新增实体+自增编号列。应仅提示不阻断，并禁止按分布修正自增ID。;
    新增记录指令命中带自增编号列（按序递增/不要分段）的表时，编号应由系统自动分配，模型不应凭语义猜测具体数值，否则会产生远高于历史分布的离群ID；应强制走自增逻辑，对编号列不做值填充。;
    新增记录指令命中带自增编号列（按序递增/不要分段）的表时，编号应由系统自动分配，模型不应凭语义猜测具体数值（如从名字/坐标推导拼接），否则产生远高于历史分布的离群ID；应强制走自增逻辑，对编号列不做值填充。
