# 列名短形式别名库
# 解决用户输入短形式（如"名"/"描"/"级"）无法精准匹配真实列名（"名称"/"描述"/"等级"）的问题。
# 匹配时：用户输入命中某短形式 → 扩展为真实列名变体 → 走正常列匹配取最高分。
#
# 结构: columns: { 表通配: { sheet通配: { 真实列名: [短形式列表] } } }
# 通配 "*" 适用于所有表/sheet。精确表/sheet 可覆盖通配。
version: '1.0'

columns:
  '*':
    '*':
      名称: ['名', '名字', '名子', '称呼']
      描述: ['描', '说明', '简介', '描述说明']
      图标: ['图', 'icon', 'img', '图标资源']
      编号: ['号', '编', '序号']
      等级: ['级', 'lv', 'level']
      类型: ['型', '分类', '类别']
      品质: ['品', '品级', '品阶']
      数量: ['数', '量', '个数']
      经验: ['经', 'exp', '经验值']
      价格: ['价', '钱', '售价']
      备注: ['注', '说明备注']
      ID: ['id']
      攻击: ['攻', '物攻', '法攻']
      防御: ['防', '物防', '法防']
      生命: ['血', 'hp', '血量']
